server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    charset utf-8;
    
    # Pilih salah satu ukuran maksimal upload (misal 100M)
    client_max_body_size 100M;

    # Tambahkan 'always' agar header tetap dikirim saat terjadi error 4xx/5xx
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Menangani favicon dan robots.txt agar tidak memenuhi access log
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        
        # Cek eksistensi file setelah path info dipisahkan
        try_files $fastcgi_script_name =404;

        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        fastcgi_buffering off;
        fastcgi_hide_header X-Powered-By;
    }

    # Blokir akses ke file tersembunyi (seperti .env, .git) kecuali .well-known
    location ~ /\.(?!well-known).* {
        deny all;
    }
}